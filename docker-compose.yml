services:
  agentmemory:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      AGENTMEMORY_DATA_DIR: /data
      HOME: /data/home
      III_COMPOSE_STATE_DIR: /data/compose-state
      III_TELEMETRY_ENABLED: "false"
      III_ENGINE_PORT: "49134"
      III_REST_PORT: "3111"
      III_VIEWER_PORT: "3113"
      AGENTMEMORY_VIEWER_HOST: 0.0.0.0
      VIEWER_ALLOWED_HOSTS: "${VIEWER_ALLOWED_HOSTS:-localhost:${AGENTMEMORY_VIEWER_PORT:-3113},127.0.0.1:${AGENTMEMORY_VIEWER_PORT:-3113},[::1]:${AGENTMEMORY_VIEWER_PORT:-3113}}"
      VIEWER_ALLOWED_ORIGINS: "${VIEWER_ALLOWED_ORIGINS:-http://localhost:${AGENTMEMORY_VIEWER_PORT:-3113},http://127.0.0.1:${AGENTMEMORY_VIEWER_PORT:-3113}}"
      MALLOC_ARENA_MAX: "2"
    ports:
      - "127.0.0.1:${AGENTMEMORY_REST_PORT:-3111}:3111"
      - "127.0.0.1:${AGENTMEMORY_VIEWER_PORT:-3113}:3113"
    volumes:
      - ${AGENTMEMORY_DATA_DIR:-iii-data}:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3111/agentmemory/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  iii-data:
